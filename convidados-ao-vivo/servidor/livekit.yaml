# Configuração do LiveKit. As chaves vêm da variável LIVEKIT_KEYS (docker-compose).
port: 7880
rtc:
  tcp_port: 7881           # fallback por TCP para redes que bloqueiam UDP
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  enabled: true
  udp_port: 3478           # TURN para convidados atrás de firewall/rede móvel
room:
  empty_timeout: 3600
  max_participants: 0      # 0 = sem limite
logging:
  level: info
